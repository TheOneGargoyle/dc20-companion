chargen:
  attribute_method: point_buy
  attributes: {might: 2, agility: 1, charisma: 2, intelligence: -1}
  # Point buy: M2=4, A1=3, C2=4, I-1=1 = 12. L3 point assumed Might 2->3 (final M3). ASK DAMO
  # (alternatives: Agility or Charisma routes are equally legal).
  ancestry_traits:
  - name: Mana Increase
    source: Fiendborn
    cost: 1
    grants: {mp: 1}
  - name: Arcane Spell
    source: Fiendborn
    cost: 2
    grants: {spells: 1}
    granted_spells: [Command]
    spell_access:
      source: Arcane
      schools: [Elemental, Enchantment]
    note: 'Fiendish Magic (Fiendborn "Arcane Spell" trait): 1 Arcane spell limited to Elemental or Enchantment schools. FR-13a slice 2 (2026-07-19): Command is now CHILDED under this ancestry trait as a source-constrained grant-child (granted_spells + spell_access), so it renders as an Arcane/Elemental-or-Enchantment-filtered picker instead of the old flat chargen spell (which showed as "(current, off-list)" against the Primal class list). Command = Arcane source, Enchantment school = legal. The {spells:1} grant is CONSUMED by this child (engine counts it via the grant, not the flat list), so the 10-spell total is unchanged.'
  - {name: Radiant Weakness, source: Fiendborn, cost: -1}
  - {name: Umbral Weakness, source: Fiendborn, cost: -1}
  - {name: Darkvision, source: Fiendborn, cost: 1}
  - {name: Draconic Breath Weapon (Fire), source: Dragonborn, cost: 2}
  - {name: Concussive Breath, source: Dragonborn, cost: 1}
    # Total 5 = L1 budget; Second Breath = the L4 spend (budget-inferred; which 2 pts landed at L4 is a guess).
  ancestry_origins: {Dragonborn: Fire, Fiendborn: Fire}  # BUG-24: per-ancestry Origin damage type (both Fire, per the ledger's inline trait names + the character header). Engine-neutral.
  spells: [Wild Guard, Primal Hide, Fireball, Fire Bolt]
  # FR-13a: ALL 10 spells named + sourced from Darryl's sheet screenshot.
  # PRIMAL (5, Druid source): Wild Guard, Primal Hide, Fireball, Fire Bolt (4 L1 table here)
  #   + Regenerate (the L3 table +1 spell, moved to L3 below where the Druid spine grants it).
  # ARCANE (5): Command (Fiendish Magic ancestry trait; FR-13a slice 2 childed it under the trait
  #   as granted_spells + spell_access, so it is NO LONGER a flat chargen spell), Disintegrating Beam
  #   + Gravity Well (L2 Spellcasting Expansion after the L5 respec, was Innate Power), Dispel Magic
  #   (Spellcaster path rank 1, L2, source-filtered flat spell), Telekinesis
  #   (Spellcaster path rank 2, L4, source-filtered flat spell). Sheet writes "Telekenesis" = a typo
  #   for Telekinesis. The exact Intuitive-vs-path split within the Arcane 5 is an assumption (all are
  #   Arcane-legal); only refine if Damo cares. No auto-heal ready slots any more.
  maneuvers: []
  combat_training: [Spell Focuses, Light Armor]

levels:
  2:
  - slot: talent
    pick: Spellcasting Expansion
    grants: {spells: 3}
    note: 'Respec at L5 (Damo''s L5 sheet, 2026-10-09): was MC Sorcerer Innate Power (Intuitive Magic, Arcane). Spellcasting Expansion adds the Arcane Source to his Spell List, so the Arcane spells stay legal; +3 spells, no +1 MP.'
    training: [Spell Focuses]
    choice: {pick: Arcane Source}       # FR-42: the spell list widening node's answer
  - slot: path
    pick: Spellcaster
    note: Spellcaster rank 1 (Arcane spell, legal via the Spellcasting Expansion widening since the L5 respec). Grants 1 spell via the caster rank (not a spells grant); the named spell is the flat Arcane {slot:spell} below.
  - slot: spell
    pick: Dispel Magic
    source: Arcane
    note: 'Arcane (Nullification), from the sheet. The Spellcaster-path rank-1 spell (Arcane, legal via Spellcasting Expansion). FR-13a slice 2 (2026-07-19): the canonical ''source: Arcane'' now source-filters this flat spell picker to the Arcane list, so it renders as a legal Arcane picker instead of showing ''(current, off-list)'' against the Primal class list. The path spell stays a flat entry (the caster-rank count derives its budget; it is NOT a grants:{spells} entry, so it is not childed under the path to avoid an engine double-count).'
  - {slot: spell, pick: Disintegrating Beam, source: Spellcasting Expansion}
  - {slot: spell, pick: Gravity Well, source: Spellcasting Expansion}
  - {slot: spell, pick: Elemental Shield, source: Spellcasting Expansion}
  3:
  - slot: subclass
    pick: Phoenix
    note: Fiery Form, Cleansing Flames, Rolling Wild Fire, Fire Within
  - {slot: attribute, pick: might, inferred: true, note: Destination unconfirmed. ASK DAMO.}
  - slot: spell
    pick: Regenerate
    source: Primal
    note: 'The L3 Druid class-table +1 spell (Primal, Invocation). Moved here from L2 (FR-13a 2026-07-19): the Druid spine grants its post-L1 table spell at L3, and Regenerate is the sheet''s 5th Primal spell.'
  4:
  - slot: talent
    pick: Meta Magic
    grants: {metamagic: 2}
    granted_metamagic: [Quickened Spell, Vicious Spell]
    note: 'FR-8 slice 4: de-bundled from the composite name into the metamagic grant + child-slots (the Meta Magic talent grants 2 Spell Enhancements; classes.md l.2618-2639). Metamagic carries no resource delta, so the derived oracle is unchanged.'
  - slot: path
    pick: Spellcaster
    inferred: true
    note: Phil's summary shows only rank 1, but MP 17 only reconciles with TWO Spellcaster ranks (9 table + 6 paths + 1 Mana Increase + 1 Innate Power). Budget-proven (L4 count, before the L5 respec removed Innate Power). This is rank 2 (Arcane spell); grants 1 Arcane spell via the caster rank (the flat {slot:spell} below).
  - {slot: ancestry_trait, pick: Second Breath, source: Dragonborn, cost: 2, inferred: true}
  - slot: spell
    pick: Telekinesis
    source: Arcane
    note: 'Arcane (Astromancy), from the sheet (which spells it ''Telekenesis'' = typo). The Spellcaster-path rank-2 spell (Arcane, legal via Spellcasting Expansion). FR-13a slice 2 (2026-07-19): the canonical ''source: Arcane'' source-filters this flat spell picker to the Arcane list (clears the old ''(current, off-list)'' tag). Flat entry like Dispel Magic (path spells derive from the caster-rank count, not a grant, so not childed under the path).'
  5:
  - {slot: attribute, pick: might, note: 'Might 3->4, Prime 4 (Damo''s L5 sheet)'}
  - slot: class_feature
    pick: Expert Druid
    note: 10 Domain Spaces (+8 per extra MP); Wild Growth +1 healing per 2 MP; Wild Forms +1 HP and +1 Trait Point; Nature's Torrent 15 Spaces plus MP enhancements. Added in builder
  - {slot: spell, pick: Enhance Ability, source: class table L5, note: Added in builder}

