# CURATED class-feature names (and their mechanical effects), per class per level.
# DC20 Beta 0.10.5, source rules/classes.md "#### Level N Class Features" blocks.
#
# WHY THIS FILE EXISTS (BUG-19 / BUG-22, 2026-07-27). `class_spines.yaml` carries the CLASS TABLE's
# generic labels ("Class Features", "Class Feature", "Talent", "Path") because that is literally what
# the table prints. The real feature NAMES live only in classes.md prose, so the builder had nothing
# to show: a scratch character got no class features at L1 and a bare "Class Feature" row at L2, and
# features with numeric effects (Barbarian Berserker) applied nothing.
#
# SCOPE (agreed with Darryl 2026-07-27): **levels 1 to 4 for the walked classes**; L5 and L6
# added 2026-09-23 ahead of the party's L5 level-up (L6 has no class feature). L7-L10 is CH-4's remainder.
# Worth knowing when filling it: classes.md has NO "#### Level 5 Class Features" heading, so the L5
# feature ("Expert <Class>") sits inside the L4 block. Do not mis-file it; the class table
# (`class_spines.yaml`) is the authority for which level a feature belongs to (L4 = Talent + Ancestry
# + Path only, L5 = Class Feature = "Expert <Class>"). For the Spellblade, Expert Spellblade grants
# **+1 Discipline** (that is the source of Tanrielle's L5 Spell Breaker).
#
# SHAPE
#   <Class>:
#     <level>:
#       - name: <feature name as printed in classes.md>
#         flavor: true              # a "(Flavor Feature)": roleplay, never mechanical
#         choice: <slot>            # this feature IS an existing picker (disciplines / pact boon),
#                                   # so it is listed for completeness but its grants live there
#         grants: {...}             # engine grant keys (hp/mp/sp/speed/jump/jump_from/ad/pd/...)
#         grants_unarmored: {...}   # applied ONLY while no armour is worn (see the note below)
#         per_held_pact_boon: {<boon>: {...}}  # extra grants for each Pact Boon the ledger holds
#                                   # (Expert Warlock); resolved by build_engine.class_feature_rider_grants
#
# grants_unarmored: DC20 has conditional defences the engine cannot express (it derives one number).
# Barbarian Berserker Defense is +2 AD "while you aren't wearing Armor" (classes.md l.114-115). The
# builder applies these only when no equipment item looks like armour (name match on armor/armour),
# and says so in the row's note, because the equipment model carries no armour TYPE. That heuristic
# matches how the canon ledgers read: bonan.yaml wears none and his sheet's AD 18 includes the +2.

catalog_version: 1
ruleset: DC20 0.10.5
classes:

  Barbarian:   # classes.md l.94-131
    1:
      - name: Rage
        no_effect: situational
      - name: Berserker
        grants: {speed: 1, jump_from: might}
        grants_unarmored: {ad: 2}
        note: "Charge, Berserker Defense (+2 AD unarmoured), Fast Movement (+1 Speed), Mighty Leap (Jump from Might)"
      - name: Shattering Force
        flavor: true
    2:
      - name: Battlecry
        note: "1 AP + 1 SP: Fortitude / Fury / Urgent shout in 5 Spaces"
        no_effect: situational
    3: []      # the class table's L3 feature is the Subclass itself (its own picker)
    4: []      # L4 grants Talent + 2 Ancestry Points + Path only, no class feature
    5:
      - name: Expert Barbarian   # classes.md l.171
        note: "Rage free as a Reaction on Initiative; Charge 3 Spaces ignoring Difficult Terrain; Battlecry 10 Spaces plus SP-enhanced shouts"
        no_effect: situational
    6: []      # L6 grants Talent + Path only

  Bard:   # classes.md l.275-518 (FR-12 Phase 3)
    1:
      - name: Font of Inspiration   # classes.md l.344-355
        note: "Ranged Help Attack (10 Spaces); Help Reaction on any Check a creature you can see makes"
        no_effect: situational
      - name: Remarkable Repertoire   # classes.md l.356-373
        grants: {spells: 2, skill_points: 2}
        spell_access: {any: true}
        # the base-class twin of talents.yaml mc_features Remarkable Repertoire (catalog_verify asserts the
        # two agree, spell_access included). Magical Secrets: "any 2 Spells of your choice from any Spell
        # List", childed under the feature as any-list pickers (BUG-30 shape). Magical Expression (Visual
        # or Auditory) swaps a Verbal/Somatic Component: a note, since the builder models no components.
        note: "Jack of All Trades 2 SP + Magical Secrets 2 spells from ANY Spell List + Magical Expression (Visual or Auditory, not modelled)"
      - name: Crowd Pleaser   # classes.md l.374-389
        flavor: true
        note: "5 minutes of Artistry vs Charisma Save: ADV on Charisma Checks against the audience for 1 hour"
    2:
      - name: Bardic Performance   # classes.md l.392-418
        note: "1 AP + 1 MP: 10 Space Aura for 1 minute, Battle Ballad / Fast Tempo / Inspiring / Emotional"
        no_effect: situational
    3: []
    4: []
    5:
      - name: Expert Bard   # classes.md l.446-464
        grants: {spells: 2, skill_points: 2}
        spell_access: {any: true}
        # "Remarkable Repertoire: You gain 2 Skill Points and learn any 2 Spells of your choice from any
        # Spell List", childed under this feature as any-list pickers like Magical Secrets.
        note: "+2 SP and 2 any-list spells (Remarkable Repertoire); Help Die d10; free performance change, +2 MP improved performances"
    6: []

  Cleric:   # classes.md l.714-1005 (FR-12 Phase 3)
    1:
      - name: Cleric Order   # classes.md l.777-795
        grants: {disciplines: 2}
        # Divine Domain: "You gain the benefits of 2 Divine Domains of your choice". The domains are
        # grant-children (cleric.yaml `domains`, the Discipline child shape), so Expert Cleric and
        # Expanded Order add theirs the same way. Divine Damage: "Choose an Elemental or Mystical damage
        # type", a node whose options are DERIVED from damage_types.yaml (parsed from core-rules.md).
        sub_choice: {kind: divine_damage, label: divine damage,
                     options_from: {damage_categories: [Elemental, Mystical]}}
        note: "Divine Damage (Elemental or Mystical type) + 2 Divine Domains"
      - name: Divine Blessing   # classes.md l.878-898
        note: "1 AP + 1 MP: Destruction (3 Divine damage), Guidance (d8 Help Die), Restoration (3 HP) on your next Spell"
        no_effect: situational
      - name: Divine Omen   # classes.md l.899-925
        flavor: true
        note: "commune with your deity once per Long Rest: a yes / no / unclear answer"
    2:
      - name: Channel Divinity   # classes.md l.930-952
        note: "once per Long Rest (regained on Initiative): Divine Rebuke or Lesser Divine Intervention"
        no_effect: situational
    3: []
    4: []
    5:
      - name: Expert Cleric   # classes.md l.983-997
        grants: {disciplines: 1}
        # "Cleric Order: You gain 1 additional Divine Domain", a grant-child like Cleric Order's two.
        note: "+1 Divine Domain; Destruction / Restoration +2 per extra MP; Divine Rebuke +1 damage; Lesser Divine Intervention pool +2"
    6: []

  Commander:   # classes.md l.~330-370
    1:
      - name: Inspiring Presence
        no_effect: situational
      - name: Commander's Call
        note: "1 AP + 1 SP: command a willing ally (the command-stack engine)"
        no_effect: situational
      - name: Natural Leader
        flavor: true
    2:
      - name: Commanding Aura
        note: "5 Space aura; Help / command range"
        no_effect: situational
    3: []
    4: []
    5:
      - name: Expert Commander   # classes.md l.1186
        note: "Commander's Call 10 Spaces, +2 SP for a 2nd command; Inspiring Presence +1 HP; Help Die starts at d10 in your Aura; Rally / Reinforce"
        no_effect: situational
    6: []

  Druid:   # classes.md l.~1600-1700
    1:
      - name: Druid Domain
        note: "1 AP + 1 MP: create Domain Spaces; Domain Actions while you hold them"
        no_effect: situational
      - name: Wild Form
        note: "1 AP + 1 MP: transform (Wild Form Stat Block + Trait Points); True Form on reverting"
        no_effect: situational
      - name: Wild Speech   # classes.md l.1456
        flavor: true
        note: "learn the Druidcraft Cantrip, then choose Animals / Plants / Weather"
    2:
      - name: Nature's Torrent
        note: "reaction damage when a creature within 10 Spaces takes Elemental damage"
        no_effect: situational
    3: []
    4: []
    5:
      - name: Expert Druid   # classes.md l.1613
        note: "10 Domain Spaces (+8 per extra MP); Wild Growth +1 healing per 2 MP; Wild Forms +1 HP and +1 Trait Point; Nature's Torrent 15 Spaces plus MP enhancements"
        no_effect: situational
    6: []

  Sorcerer:   # classes.md l.2539-2692 (FR-12 Phase 3)
    1:
      - name: Innate Power   # classes.md l.2541-2560
        grants: {mp: 1}
        # the base-class twin of talents.yaml mc_features Innate Power (catalog_verify asserts the
        # two agree). Intuitive Magic's 2 spells are "from your Spell List": own_list childs them
        # under this feature, filtered to the class's chosen Spell Source (no source_pick, unlike MC).
        sub_choice: {kind: sorcerous_origin, label: sorcerous origin, options: [
          {name: Intuitive Magic, grants: {spells: 2}, own_list: true},
          {name: Resilient Magic, no_effect: situational, note: "Dazed Resistance"},
          {name: Unstable Magic, no_effect: situational, note: "Wild Magic Table on a Spell crit success/fail"}]}
        note: "+1 max MP; 1 point Focus Property (not modelled); Sorcerous Origin sub-choice"
      - name: Overload Magic   # classes.md l.2600-2612
        note: "1 AP + 1 MP: +5 Spell Attacks and Spell Checks for 1 minute; Attribute Save or Exhaustion"
        no_effect: situational
      - name: Sorcery   # classes.md l.2613
        flavor: true
        note: "learn the Sorcery Spell"
    2:
      - name: Meta Magic   # classes.md l.2618-2639
        grants: {metamagic: 2}
        note: "2 unique Spell Enhancements (metamagic.yaml); 1 per Spell; once per Long Rest one costs 0 MP"
    3: []
    4: []
    5:
      - name: Expert Sorcerer   # classes.md l.2674-2692
        grants: {mp: 1, metamagic: 1}
        note: "+1 max MP and a 2nd Focus Property (Innate Power); Overload drops the opening Save; +1 Meta Magic and 2 at a time"
    6: []

  Spellblade:   # classes.md l.~2840-2930
    1:
      - name: Bound Weapon
        note: "bond with a weapon on a Quick Rest; Bound Damage"
        no_effect: situational
      - name: Spellblade Disciplines
        choice: spellblade_disciplines
        note: "learn 2 Disciplines from the list; the picker at L1 owns these"
      - name: Sense Magic
        flavor: true
    2:
      - name: Spellstrike
        note: "once per turn, ride a Spell on a Martial Attack"
        no_effect: situational
    3: []
    4: []
    5:
      - name: Expert Spellblade   # classes.md l.3000
        grants: {disciplines: 1}
        note: "+1 Spellblade Discipline; Bound Damage ignores Resistance; Acolyte / Hex Warrior / Spell Warder scale with MP; Spellstrike spells may target multiple creatures or an Area"
    6: []

  Warlock:   # classes.md l.~3200-3280
    1:
      - name: Warlock Contract
        note: "the patron bargain; Hasty Bargain / Desperate Bargain"
        no_effect: situational
      - name: Pact Boon
        choice: pact_boon
        note: "Pact Weapon / Armor / Spell / Familiar; the boon picker at L1 owns these"
      - name: Beseech Patron
        flavor: true
    2:
      - name: Life Tap
        note: "spend HP in place of MP on an MP Effect"
        no_effect: situational
    3: []
    4: []
    5:
      - name: Expert Warlock   # classes.md l.3366
        grants: {hp: 2}
        per_held_pact_boon:          # classes.md l.3366-3395: each HELD boon adds its own rider
          Pact Weapon: {maneuvers: 1}  # +1 Attack Maneuver (and +1 point Weapon Property, not modelled)
          Pact Armor: {maneuvers: 1}   # +1 Defense Maneuver (and +1 point Armor Property, not modelled)
          Pact Spell: {spells: 2}      # 2 Spells from any Spell Source
        note: "+2 max HP; Pact Weapon / Armor each gain +1 Property and +1 Attack / Defense Maneuver; Pact Spell learns 2 Spells; Life Tap Checks at ADV"
    6: []

  Wizard:   # classes.md l.3524-3640 (FR-12 Phase 3)
    1:
      - name: Spell School Initiate   # classes.md l.3526-3536
        grants: {spells: 2}
        # the base-class twin of talents.yaml mc_features Spell School Initiate (catalog_verify asserts
        # the two agree). School Magic: "Choose a Spell School ... You learn 2 Arcane Spells from this
        # Spell School". The node's options are DERIVED from spell_sources.yaml's Arcane schools, and
        # choosing one childs the 2 spells under the feature, filtered to Arcane + that school.
        sub_choice: {kind: school_magic, label: spell school,
                     options_from: {source_schools: Arcane}, child_spells: {source: Arcane}}
        note: "School Magic: 2 Arcane spells from the chosen School; Signature School -1 MP once per Long Rest (not modelled)"
      - name: Arcane Sigil   # classes.md l.3537-3555
        note: "1 AP + 1 MP: a 1 Space Sigil; ADV on Checks to cast Spells of the chosen School or Tag inside it"
        no_effect: situational
      - name: Ritual Caster   # classes.md l.3556-3562
        flavor: true
        note: "learn 1 Ritual; learn found Rituals over a Short Rest"
    2:
      - name: Prepared Spell   # classes.md l.3567-3578
        note: "after a Long Rest choose 1 known Spell: Mana Limit Break (+1 Mana Spend Limit once) and Rehearsed Casting"
        no_effect: situational
    3: []
    4: []
    5:
      - name: Expert Wizard   # classes.md l.3610-3631
        grants: {spells: 1}
        # "You learn 1 additional Arcane Spell from the chosen School": the +1 is childed under this
        # feature, filtered to Arcane + the school on Spell School Initiate's node (read live, so a
        # changed L1 school re-filters it; builder_api _spell_grant_source).
        child_spells: {source: Arcane, school_from: Spell School Initiate}
        note: "+1 Arcane spell from the Spell School Initiate school; Signature School -1 more MP; Sigil Tag/Area enhancements; 2 Prepared Spells"
    6: []
