# CURATED - hand-maintained. Per-character single-target damage add-ons for the
# Companion Damage Calculator (FR-25 v1). Verified by tools/catalog_verify.py against
# the six build ledgers/files (08-16) and rules/*.md.
#
# MODEL. Two parts:
#   defs        - a reusable library of add-on definitions (an id -> a widget spec).
#   characters  - per-character assignment (base damage + which add-ons apply). Damage
#                 add-ons are genuinely per-character (they come from items, spells and
#                 subclass picks), so the two Spellblades differ - this is why the file is
#                 keyed by character handle, not by class like stamina_regen.yaml.
#
# WIDGET TYPES.
#   toggle   - a fixed +amount, on/off.
#   stepper  - +per each, count 0..cap. cap is an integer, or cap_stat: sp|mp|spend_limit,
#              resolved at render time in the Companion against the engine-derived bake
#              (max SP / max MP / the Mana-Stamina Spend Limit, which is CM and so rises
#              with level). BUG-37: prefer cap_stat, a literal cap freezes at today's level.
#
# SCOPE (v1). Single-hit total only: base + hit-grade + crit + additive single-target
# riders. OUT of v1 (a possible v2): AoE / per-target / N-targets math (Whirlwind,
# Fireball/Breath area, Chain), target Damage Reduction, and ruling-dependent engines
# (Rolling Wild Fire). Accuracy-only riders (Call of the Grave, Hasty Bargain) are NOT
# damage and are excluded by design.
catalog_version: 1
ruleset: DC20 0.10.5
source: rules/core-rules.md l.2376 (Adding Damage Order) + rules/combat.md l.1807 (MP on AP Enhancements) + build files 08-16

# --- Reusable add-on definitions ------------------------------------------------------
defs:
  smite:
    label: "Smite (Bound dmg)"
    type: stepper
    per: 1            # +1 Bound damage per SP spent (the free enhancement is separate, see smite_free)
    cap_stat: spend_limit   # Darryl 2026-08-14: capped by the STAMINA SPEND LIMIT, not by max SP.
                            # 09's dev-intent section says Smite is "capped only by the Stamina
                            # Spend Limit"; at L4 that is 2, and max SP 3 was over-reporting.
    unit: SP
    note: "single target; +1 Bound damage per SP, capped by the Stamina Spend Limit"
  smite_free:
    label: "Smite free enhancement"
    type: toggle
    amount: 1
    note: "the ONE free Damage enhancement Smite grants (once, no matter how many SP spent)"
  spellstrike:
    label: "Spellstrike"
    type: toggle
    amount: 1        # default; per-character bolt damage set as an override below
    note: "folds the Bound-Weapon spell into the hit"
  mp_to_damage:
    label: "MP to damage"
    type: stepper
    per: 2            # 1 MP = 2 AP-worth of Damage enhancements = +2 (combat.md l.1807)
    cap_stat: spend_limit   # BUG-37: the Mana Spend Limit, derived per character (was frozen at 2)
    unit: MP
    note: "spell portion; cap = Mana Spend Limit"
  gen_damage:
    label: "Damage enhancement"
    type: stepper
    per: 1
    cap_stat: spend_limit   # BUG-37: the Stamina Spend Limit, derived per character (was frozen at 2)
    unit: AP/SP
    note: "single target; +1 per AP or SP spent (cap = Stamina Spend Limit)"
  powerful:
    label: "Powerful focus"
    type: toggle
    amount: 1
    note: "+1 to spell damage (passive; applies through Spellstrike)"
  rage:
    label: "Rage"
    type: toggle
    amount: 1
    note: "+1 melee damage while Raging"
  deaths_toll:
    label: "Death's Toll"
    type: toggle
    amount: 1
    note: "+1 vs Bloodied targets (Radiant Bolt pact rider)"
  battlefield:
    label: "Battlefield Tactics"
    type: toggle
    amount: 1
    note: "+1 on your first melee attack vs a Flanked target"
  imbue:
    label: "Imbued strike"
    type: toggle
    amount: 1
    note: "+1 per martial hit (not on spell bolts); 1-min buff"
  impact:
    # BUG-52. general-rules.md l.965: "Impact: The Weapon deals +1 damage on Heavy Hits."
    # core-rules.md l.2323: "Brutal Hits are considered Heavy Hits for purposes of effects
    # that trigger on a Heavy Hit", so the gate is grade >= Heavy, not grade == Heavy.
    label: "Impact (Heavy Hit)"
    type: toggle
    amount: 1
    when: heavy       # contributes only at hit grade Heavy or better; enforced in dmgSync
    note: "+1 damage on Heavy Hits; Brutal and Beyond count as Heavy"

# --- Per-character assignment (L4) -----------------------------------------------------
# base      = the Damage Calculator's default Base Damage (editable per hit).
# base_note = shown beside the base stepper.
# addons    = ordered list; an id from defs, or {id, ...overrides} (e.g. spellstrike's amount/label).
#
# BUG-52 note on the impact add-on. ALL SIX carry an Impact weapon. Source of truth is the
# Weapon Table in general-rules.md for a stock weapon, and the character's own gear card only
# where a magic item ADDS a property the stock weapon lacks (Bonan's Heavy Glaive, which the
# table lists without Impact). Reading the gear cards alone under-counts, which is how the
# filed row said four and how Tanrielle was missed on the first pass.
#
# Impact is a property of a WEAPON, and the calculator's
# base is per-character and editable, so the toggle carries the weapon it comes from and
# defaults ON only where that weapon IS the character's stated base attack. Where the base
# is a spell bolt or a non-Impact weapon the toggle ships OFF, so nothing over-reports until
# the player says they swung the Impact weapon. catalog_verify derives default_on from the
# weapon name against base_note rather than trusting the flag, so a base_note edit that
# invalidates the pairing fails the build.
characters:
  tan:
    base: 2
    base_note: "Greatsword of the Keepers"
    addons:
      # Darryl 2026-08-15: the filed BUG-52 row said Tan's Greatsword was NOT an Impact
      # weapon and that was wrong. general-rules.md's Weapon Table has Greatsword as
      # "Two-Handed, Heavy, Impact" (her Longbow carries it too). It is six of six.
      - {id: impact, weapon: "Greatsword of the Keepers", default_on: true}
      - smite
      - smite_free
      # Darryl 2026-08-14: the Spellstrike carries the spell, so its riders read UNDER it. MP to
      # damage is an enhancement ON that spell, and Death's Toll triggers off it.
      - {id: spellstrike, label: "Spellstrike (Radiant Bolt)", amount: 2, note: "folds in Radiant Bolt (2 dmg, incl. Powerful focus)"}
      - mp_to_damage
      - deaths_toll
  xan:
    base: 1
    base_note: "Light Short Sword"
    addons:
      - {id: impact, weapon: "Light Weight Short Sword", default_on: true}
      - smite
      - smite_free
      - {id: imbue, label: "Umbral Imbued"}
      # Spellstrike above its MP enhancement, same reason as tan above.
      - {id: spellstrike, label: "Spellstrike (Umbral Bolt)", amount: 1, note: "folds in Umbral Bolt (1 dmg)"}
      - mp_to_damage
  runt:
    base: 2
    base_note: "Lightning Bolt (incl. Powerful focus +1)"
    addons:
      - mp_to_damage
      - {id: imbue, label: "Lightning Imbued", note: "+1 per MARTIAL hit (slams/staff), not on bolts"}
      # base is a bolt, so OFF by default; turn it on for a staff or knuckle swing.
      - {id: impact, weapon: "Pact Staff", default_on: false, note: "+1 on Heavy Hits with the Pact Staff or Brass Knuckles, not on bolts"}
  min:
    base: 3
    base_note: "Crossbow"
    addons:
      - gen_damage
      - battlefield
      # base is the Crossbow, which is not Impact; the Longpole is.
      - {id: impact, weapon: "Longpole", default_on: false, note: "+1 on Heavy Hits with the Longpole, not the Crossbow"}
  bonan:
    base: 2
    base_note: "Mace (shown un-Raged; toggle Rage below)"
    addons:
      - {id: impact, weapon: "Baleful Black Iron Mace", default_on: true, note: "+1 on Heavy Hits; both the Baleful Mace and the Heavy Glaive are Impact"}
      - rage
      - gen_damage
  scale:
    base: 1
    base_note: "Fire Bolt (AoE Fireball/Breath are a v2 item)"
    addons:
      - mp_to_damage
      - powerful
      # NOT in the filed BUG-52 row, which named four PCs. The Mage Staff of Impact is on
      # Scaletrix's gear card, so it is five of six, and the base is a bolt so it ships OFF.
      - {id: impact, weapon: "Mage Staff of Impact", default_on: false, note: "+1 on Heavy Hits with the Mage Staff, not on spell bolts"}
