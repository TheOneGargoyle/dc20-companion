# CURATED cross-cutting cost list: ancestry-trait point costs.
# Source: rules/ancestries.md (Human l.329-352, Elf l.354-383, Dwarf l.385-417, Halfling
# l.418-453, Dragonborn l.522-597, Giantborn l.598-634, Angelborn l.635-693, Fiendborn
# l.694-763, Beastborn l.764-973 incl. the Beast Traits list). Costs are the (N) prefix on
# each trait line; negative = drawback that refunds points. `requires:` mirrors a trait's
# "(requires X)" prerequisite from the rules text. tools/catalog_verify.py re-parses
# ancestries.md and asserts every cost AND prerequisite below matches the source.
#
# Scope (validate-don't-enumerate): the ancestries the six walked builds touch.
#   Tanrielle  Half-elf            -> Human + Elf
#   Runt       Giantborn / Dwarf   -> Giantborn + Dwarf
#   Minimus    Halfling Kitsune    -> Halfling + Beastborn (ledger source name: Beast)
#   Bonan      Halfling Beastborn  -> Halfling + Beastborn
#   Scaletrix  Redemption Fiendborn + Dragonborn -> Fiendborn + Dragonborn (+ Angelborn via
#              the Redeemed trait: "you can now spend your Ancestry Points on Angelborn Traits")
#   Xanwyn     Elven (Elf + Beast) -> Elf + Beastborn
#
# source_aliases: ledger `source:` names that map onto a curated list here.
# aliases on a trait: ledger names for the same rules-text trait (e.g. Scaletrix's "Arcane
# Spell" is the Fiendborn trait the rules call "Fiendish Magic": learn 1 Arcane spell).
#
# Option effects (2026-07-25 / 2026-07-27). A trait def may carry:
#   grants:       the mechanical effect the builder copies onto the ledger entry on pick, so a
#                 scratch pick APPLIES its effect and not just its cost. Numeric keys feed the
#                 engine directly (mp/hp/jump/jump_from); `spells: N` is a CHOICE grant.
#   spell_access: {source, schools} - the FR-13a constraint that turns a `spells: N` grant into
#                 N source-filtered spell child-pickers glued under the trait (BUG-25). Only the
#                 two spell-granting ancestry traits carry it: Fiendish Magic (Arcane, Elemental
#                 or Enchantment, l.718-726) and Celestial Magic (Divine, any school, l.654-658).
#                 The damage-type rider on Fiendish Magic ("must match your Fiendish damage") is
#                 the BUG-24 Origin's business, not a filterable spell property, so it is not
#                 enforced here.

catalog_version: 1
source_aliases: {Beast: Beastborn}
# origins: the per-ancestry damage-type choice (ancestries.md l.525-532 Draconic Origin,
# l.696-701 Fiendish Origin). "All future choices within this Ancestry must use the chosen
# Origin." It is engine-neutral (records a damage type, no derived-stat effect); the builder
# renders ONE picker per present origin-ancestry so a scratch pick can record it (BUG-24).
# tools/catalog_verify.py re-parses the two Origin lists from ancestries.md and asserts a match.
origins:
  Dragonborn: [Cold, Corrosion, Fire, Lightning, Poison, Psychic, Radiant, Umbral]
  Fiendborn: [Cold, Corrosion, Fire, Poison, Umbral]
